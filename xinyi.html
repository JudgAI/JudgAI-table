<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銷售數據互動儀表板</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for component-based UI -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) for Excel file parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* --- CSS Variables for Theming --- */
        :root, .light {
            --bg-color: #f1f5f9; /* Slate 100 */
            --text-color: #1e293b; /* Slate 800 */
            --text-color-light: #64748b; /* Slate 500 */
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(226, 232, 240, 1); /* Slate 200 */
            --nav-button-text: #334155;
            --nav-button-active-text: #2563eb; /* Blue 600 */
            --active-indicator: #2563eb;
            --table-header-bg: rgba(226, 232, 240, 0.5);
            --table-border: #e2e8f0;
            --table-row-hover: rgba(241, 245, 249, 0.8);
        }
        .dark {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --text-color-light: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(51, 65, 85, 0.5);
            --nav-button-text: #e2e8f0;
            --nav-button-active-text: #60a5fa;
            --active-indicator: #3b82f6;
            --table-header-bg: rgba(51, 65, 85, 0.5);
            --table-border: #334155;
            --table-row-hover: rgba(51, 65, 85, 0.5);
        }
        /* --- Base Styles using Variables --- */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', '微軟正黑體', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .dashboard-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .dashboard-card:hover {
            border-color: rgba(59, 130, 246, 0.7);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        .nav-button {
            transition: all 0.3s ease;
            position: relative;
            color: var(--nav-button-text);
        }
        .nav-button:after {
            content: '';
            position: absolute;
            bottom: -1px; /* Adjust to sit on top of the border */
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background-color: var(--active-indicator);
            transition: width 0.3s ease;
        }
        .nav-button.active:after, .nav-button:hover:after {
            width: 80%;
        }
        .nav-button.active {
            color: var(--nav-button-active-text);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Chart Generation Utility ---
        const ChartComponent = ({ chartConfig }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (canvasRef.current && chartConfig) {
                    if (chartRef.current) chartRef.current.destroy();
                    const ctx = canvasRef.current.getContext('2d');
                    chartRef.current = new Chart(ctx, chartConfig);
                }
                return () => {
                    if (chartRef.current) chartRef.current.destroy();
                };
            }, [chartConfig]); 

            return <canvas ref={canvasRef}></canvas>;
        };
        
        // --- Main Application Component ---
        function App() {
            const [sheets, setSheets] = useState(null);
            const [activeTab, setActiveTab] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [theme, setTheme] = useState('dark');

            const VISITOR_ANALYSIS_KEY = '來人結構分析';

            // --- Theme Management ---
            useEffect(() => {
                const root = document.documentElement;
                if (theme === 'light') {
                    root.classList.remove('dark');
                    root.classList.add('light');
                    Chart.defaults.color = '#475569'; // Slate 600
                    Chart.defaults.borderColor = 'rgba(203, 213, 225, 0.8)';
                } else {
                    root.classList.remove('light');
                    root.classList.add('dark');
                    Chart.defaults.color = '#94a3b8'; // Slate 400
                    Chart.defaults.borderColor = 'rgba(51, 65, 85, 0.8)';
                }
                 // Redraw charts on theme change
                const charts = Chart.instances;
                Object.values(charts).forEach(chart => chart.update());
            }, [theme]);
            
            const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

            // --- Excel File Upload Handler ---
            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setIsLoading(true);
                setError('');

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = e.target.result;
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        const sheetsData = {};
                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" }); 
                            const nonEmptyData = jsonData.filter(row => row.some(cell => cell !== null && cell !== ''));
                            if(nonEmptyData.length > 0) {
                                sheetsData[sheetName] = nonEmptyData;
                            }
                        });
                        
                        setSheets(sheetsData);
                        const defaultTab = workbook.SheetNames.includes('周報表') ? '周報表' : workbook.SheetNames[0];
                        setActiveTab(defaultTab);
                    } catch (err) {
                        console.error("檔案解析錯誤:", err);
                        setError('檔案解析失敗，請確認為有效的 Excel 檔案 (.xlsx)。');
                    } finally {
                        setIsLoading(false);
                    }
                };
                reader.onerror = (err) => {
                    console.error("檔案讀取錯誤:", err);
                    setError('讀取檔案時發生錯誤。');
                    setIsLoading(false);
                };
                reader.readAsArrayBuffer(file);
            };

            // --- Chart Configuration Generation (Memoized) ---
            const chartConfigs = useMemo(() => {
                if (!sheets || !activeTab) return {};
                const configs = {};
                
                const visitorSheetKeys = Object.keys(sheets).filter(key => key.startsWith('來人結構分析表-'));
                const visitorSheets = visitorSheetKeys.map(key => ({ 
                    name: key.replace('來人結構分析表-', ''), 
                    data: sheets[key] 
                }));

                if (activeTab === VISITOR_ANALYSIS_KEY && visitorSheets.length > 0) {
                     visitorSheets.forEach(sheet => {
                        try {
                             const headers = sheet.data[0].slice(1, -1);
                             const weeklyData = sheet.data[1].slice(1, -1).map(Number);
                             const chartType = ['性別', '購屋型態'].includes(sheet.name) ? 'doughnut' : 'bar';
                             
                             configs[sheet.name] = {
                                 type: chartType,
                                 data: {
                                     labels: headers,
                                     datasets: [{
                                         label: '本週人數',
                                         data: weeklyData,
                                         backgroundColor: chartType === 'bar' ? 'rgba(59, 130, 246, 0.5)' : ['#3b82f6', '#ef4444', '#22c55e', '#eab308', '#8b5cf6', '#ec4899'],
                                         borderColor: chartType === 'bar' ? '#3b82f6' : (theme === 'dark' ? '#0f172a' : '#f1f5f9'),
                                         borderWidth: 2,
                                     }]
                                 },
                                 options: {
                                     responsive: true, maintainAspectRatio: false,
                                     plugins: {
                                         title: { display: true, text: `${sheet.name}分析`, font: { size: 16 }, padding: { bottom: 20 } },
                                         legend: { position: chartType === 'doughnut' ? 'bottom' : 'none' }
                                     },
                                     scales: chartType === 'bar' ? { y: { beginAtZero: true }, x: { grid: { display: false } } } : {}
                                 }
                             };
                        } catch (e) { console.error(`處理 ${sheet.name} 圖表時出錯:`, e)}
                     });
                } else if (sheets[activeTab]) {
                    // Logic for individual sheets (same as before)
                    try {
                        if (activeTab === '區域分析表') {
                             const headers = sheets[activeTab][3].slice(3, -1);
                             const weeklyVisitors = sheets[activeTab][5].slice(3, -1).map(v => parseFloat(v) || 0);
                             configs[activeTab] = {
                                type: 'bar', data: { labels: headers, datasets: [{ label: '本週來人比例 (%)', data: weeklyVisitors, backgroundColor: 'rgba(34, 197, 94, 0.5)', borderColor: '#22c55e', borderWidth: 2, }] },
                                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: '各區域來人分析 (本週)', font: { size: 18 } } } }
                             };
                        } else if (activeTab === '媒體分析表') {
                             const headers = sheets[activeTab][3].slice(3, -1);
                             const weeklyVisitors = sheets[activeTab][5].slice(3, -1).map(v => parseFloat(v) || 0);
                             configs[activeTab] = {
                                type: 'bar', data: { labels: headers, datasets: [{ label: '本週來人比例 (%)', data: weeklyVisitors, backgroundColor: 'rgba(234, 179, 8, 0.5)', borderColor: '#eab308', borderWidth: 2, }] },
                                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: '各媒體來人分析 (本週)', font: { size: 18 } } } }
                             }
                        } else if (activeTab === '周報表') {
                            const dates = sheets[activeTab][2].slice(3, 10);
                            const visitors = sheets[activeTab][5].slice(3, 10).map(Number);
                            const calls = sheets[activeTab][6].slice(3, 10).map(Number);
                            configs[activeTab] = {
                                type: 'line', data: { labels: dates, datasets: [ { label: '來人', data: visitors, borderColor: '#3b82f6', tension: 0.3, fill: false }, { label: '來電', data: calls, borderColor: '#22c55e', tension: 0.3, fill: false }] },
                                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: '每日來人與來電趨勢', font: { size: 18 } } } }
                            }
                        }
                    } catch (e) { console.error(`處理 ${activeTab} 圖表時出錯:`, e)}
                }

                return configs;
            }, [sheets, activeTab, theme]);

            // --- Content Rendering Logic ---
            const renderContent = () => {
                if (isLoading) return <div className="text-center p-10">讀取與分析 Excel 檔案中...</div>;
                if (error) return <div className="text-center p-10 text-red-400">{error}</div>;
                if (!sheets) return (
                    <div className="flex flex-col items-center justify-center h-full">
                         <div className="w-full max-w-lg p-8 space-y-4 text-center dashboard-card rounded-xl">
                            <h2 className="text-2xl font-bold">上傳銷售報表 Excel 檔案</h2>
                            <p className="text-[var(--text-color-light)]">請選擇一個 Excel (.xlsx) 檔案，系統將自動為您生成儀表板。</p>
                            <input
                                type="file"
                                accept=".xlsx, .xls"
                                onChange={handleFileUpload}
                                className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                            />
                        </div>
                    </div>
                );

                if (activeTab === VISITOR_ANALYSIS_KEY) {
                    return (
                         <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 p-4 md:p-6">
                           {Object.keys(chartConfigs).map(key => (
                               <div key={key} className="dashboard-card rounded-lg p-4 h-96">
                                   <ChartComponent chartConfig={chartConfigs[key]} />
                               </div>
                           ))}
                        </div>
                    );
                }
                
                const chartConfig = chartConfigs[activeTab];
                const sheetData = sheets[activeTab];

                return (
                    <div className="p-4 md:p-6 space-y-6">
                        {chartConfig && (
                            <div className="dashboard-card rounded-lg p-4 h-[500px]">
                                <ChartComponent chartConfig={chartConfig} />
                            </div>
                        )}
                        {!chartConfig && <div className="text-center text-[var(--text-color-light)] p-8">此工作表無對應的圖表類型，將以表格呈現。</div>}
                        
                        <div className="dashboard-card rounded-lg p-4 overflow-x-auto">
                            <h3 className="text-lg font-semibold mb-4">{activeTab} - 原始數據</h3>
                            <table className="w-full text-sm text-left text-[var(--text-color-light)]">
                                <thead className="text-xs uppercase bg-[var(--table-header-bg)]">
                                    <tr>
                                        {sheetData[0].map((header, i) => <th key={i} className="px-6 py-3">{header}</th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {sheetData.slice(1).map((row, i) => (
                                        <tr key={i} className="border-b border-[var(--table-border)] hover:bg-[var(--table-row-hover)]">
                                            {row.map((cell, j) => <td key={j} className="px-6 py-4">{cell}</td>)}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };
            
            const navItems = sheets ? [VISITOR_ANALYSIS_KEY, ...Object.keys(sheets).filter(s => !s.startsWith('來人結構分析表-'))] : [];

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-6">
                    <header className="relative text-center mb-6 px-12">
                        <h1 className="text-3xl md:text-4xl font-bold tracking-wider">銷售數據互動儀表板</h1>
                        <p className="text-[var(--text-color-light)] mt-2">即時數據洞察，驅動商業決策</p>
                         <div className="absolute top-0 right-0 p-2">
                            <button onClick={toggleTheme} className="p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[var(--bg-color)] focus:ring-blue-500 transition-colors duration-300 bg-[var(--card-bg)]">
                                {theme === 'dark' ? 
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg> : 
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                                }
                            </button>
                        </div>
                    </header>
                    {sheets && (
                         <nav className="flex flex-wrap justify-center gap-2 md:gap-4 mb-6 border-b border-[var(--table-border)] pb-3">
                           {navItems.map(name => (
                               <button key={name} onClick={() => setActiveTab(name)} className={`nav-button px-4 py-2 text-sm md:text-base font-medium ${activeTab === name ? 'active' : ''}`} >
                                  {name}
                               </button>
                           ))}
                         </nav>
                    )}
                    <main className="flex-grow flex flex-col">
                        {renderContent()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
