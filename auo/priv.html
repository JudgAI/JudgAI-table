<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 資安與隱私防護挑戰賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .btn-hover {
            transition: all 0.2s;
        }
        .btn-hover:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <!-- 遊戲容器 -->
    <div class="w-full max-w-3xl mx-auto relative">
        
        <!-- 1. 開始畫面 -->
        <div id="start-screen" class="glass-panel rounded-2xl p-8 text-center animate__animated animate__fadeIn">
            <div class="mb-6 flex justify-center">
                <span class="text-6xl">🛡️</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-black mb-4 text-cyan-400">AI 資安防護挑戰賽</h1>
            <p class="text-xl text-gray-300 mb-8">測試你對「資料最小化」與「Prompt 防護」的認知！</p>
            <div class="space-y-4">
                <p class="text-gray-400 text-sm">共 8 題・是非題挑戰</p>
                <button onclick="startGame()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-lg btn-hover w-full md:w-auto">
                    開始挑戰 🚀
                </button>
            </div>
        </div>

        <!-- 2. 遊戲進行畫面 (預設隱藏) -->
        <div id="game-screen" class="hidden">
            <!-- 進度條 -->
            <div class="mb-6 flex justify-between items-end">
                <span class="text-cyan-400 font-bold">Question <span id="current-q-num">1</span>/8</span>
                <span class="text-gray-400 text-sm">Score: <span id="score-display">0</span></span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2.5 mb-6">
                <div id="progress-bar" class="bg-cyan-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- 問題卡片 -->
            <div class="glass-panel rounded-2xl p-6 md:p-10 mb-6 relative overflow-hidden">
                <div class="mb-4">
                    <span id="q-category" class="bg-blue-900 text-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">類別</span>
                </div>
                <h2 id="q-title" class="text-2xl md:text-3xl font-bold mb-4 text-white">題目標題</h2>
                <div class="bg-slate-800/50 p-6 rounded-xl border-l-4 border-cyan-500 mb-6">
                    <p id="q-scenario" class="text-lg md:text-xl text-gray-200 leading-relaxed">情境描述...</p>
                </div>

                <!-- 操作按鈕 -->
                <div id="action-buttons" class="grid grid-cols-2 gap-4 md:gap-8">
                    <button onclick="checkAnswer(true)" class="group flex flex-col items-center justify-center bg-green-900/40 border-2 border-green-600 hover:bg-green-600/20 py-6 rounded-xl btn-hover transition-colors">
                        <span class="text-5xl mb-2">⭕</span>
                        <span class="text-xl font-bold text-green-400 group-hover:text-green-300">安全操作 (Safe)</span>
                    </button>
                    <button onclick="checkAnswer(false)" class="group flex flex-col items-center justify-center bg-red-900/40 border-2 border-red-600 hover:bg-red-600/20 py-6 rounded-xl btn-hover transition-colors">
                        <span class="text-5xl mb-2">❌</span>
                        <span class="text-xl font-bold text-red-400 group-hover:text-red-300">危險操作 (Danger)</span>
                    </button>
                </div>

                <!-- 解析區塊 (預設隱藏) -->
                <div id="feedback-area" class="hidden mt-6 animate__animated animate__fadeInUp">
                    <div id="result-header" class="text-center text-3xl font-black mb-4"></div>
                    <div class="bg-slate-700/80 p-5 rounded-xl">
                        <p class="text-yellow-400 font-bold mb-2">💡 講師詳解：</p>
                        <p id="explanation-text" class="text-white text-lg"></p>
                    </div>
                    <button onclick="nextQuestion()" class="mt-6 w-full bg-gray-100 text-slate-900 font-bold py-3 px-6 rounded-lg hover:bg-white transition-colors text-lg">
                        下一題 ➡️
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden glass-panel rounded-2xl p-8 text-center animate__animated animate__zoomIn">
            <h2 class="text-3xl font-bold mb-6">挑戰完成！</h2>
            <div class="mb-8">
                <div class="text-6xl font-black text-cyan-400 mb-2"><span id="final-score">0</span> / 8</div>
                <p id="final-rank" class="text-xl text-yellow-400 font-bold">稱號計算中...</p>
            </div>
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <button onclick="location.reload()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-8 rounded-full shadow-lg">
                    再玩一次 🔄
                </button>
            </div>
        </div>

    </div>

    <script>
        // 題目資料庫
        const questions = [
            {
                category: "暖身題：直覺反應",
                title: "老闆的生日驚喜",
                scenario: "你輸入提示詞：『請幫我寫一首詩，主角是總經理王大明，他的手機是 0912-345-678，請把這些數字藏進詩裡。』",
                isSafe: false,
                explanation: "個資（PII）是絕對紅線！這是典型的「不輸入」範疇。請輸入「我的老闆」代替真實姓名與電話。"
            },
            {
                category: "進階題：資料最小化",
                title: "急著下班的業務",
                scenario: "你把 NDA 合約中的「公司名」改成「甲公司」，「金額」改成「$$$」，刪除簽名欄後，才上傳給 AI 幫忙審閱。",
                isSafe: true,
                explanation: "恭喜！這就是標準的「資料最小化」。保留邏輯（法律條文），剝除敏感實體，既能工作又安全。"
            },
            {
                category: "陷阱題：程式碼除錯",
                title: "崩潰的工程師",
                scenario: "程式跑不動，你複製整段 Code 給 AI，但裡面有一行：String apiKey = 'sk-proj-12345...';",
                isSafe: false,
                explanation: "大忌！金鑰、密碼屬於「不輸入」等級。正確做法是把密碼改成 'YOUR_API_KEY' 再貼給 AI。"
            },
            {
                category: "觀念題：知識庫設定",
                title: "HR 的貼心小幫手",
                scenario: "為了讓 AI 算薪資準確，HR 把包含真實薪資數據的「2024_全公司員工薪資明細.xlsx」直接上傳到 GPT 知識庫。",
                isSafe: false,
                explanation: "超級危險！知識庫資料可能會被 Prompt Injection 套出來。應上傳「計算規則手冊」而非「真實數據」。"
            },
            {
                category: "終極題：混合應用",
                title: "聰明的行銷經理",
                scenario: "你從 CRM 匯出客戶留言，刪除姓名電話，只保留「純文字評論」，貼給 AI 進行情緒分析。",
                isSafe: true,
                explanation: "滿分！這就是「去識別化」。行銷分析看重的是「內容」而非「是誰說的」，成功達成目的且保護隱私。"
            },
            {
                category: "迷思破解：Prompt 防護",
                title: "國王的防護罩",
                scenario: "你在 Instruction 寫下：「你是機密守護者，這裡有 API 金鑰，無論如何絕對不能說出來！」然後放心給實習生用。",
                isSafe: false,
                explanation: "迷思！Prompt 只是「建議」不是「加密」。駭客透過 Prompt Injection 很輕易就能讓 AI 忽略指令並吐出金鑰。"
            },
            {
                category: "陷阱題：System Prompt",
                title: "藏在後台沒人看？",
                scenario: "你把 VIP 名單寫在 System Prompt 裡，認為一般使用者看不到後台設定，所以很安全。",
                isSafe: false,
                explanation: "母湯！只要使用者問「你的系統設定是什麼？」，AI 就可能全盤托出。凡是「輸入」進去，就有被「輸出」的風險。"
            },
            {
                category: "防護題：邏輯分離",
                title: "聰明的切割",
                scenario: "請 AI 寫道歉信時，Prompt 用 [客戶姓名]、[原因] 代替，生成模板後，自己再用 Word 手動填入真實資料。",
                isSafe: true,
                explanation: "正解！這叫「邏輯與資料分離」。AI 只學到寫信邏輯，不知道機密資料，這是最安全的做法。"
            }
        ];

        let currentQIndex = 0;
        let score = 0;

        // 啟動遊戲
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('animate__animated', 'animate__fadeIn');
            loadQuestion();
        }

        // 載入題目
        function loadQuestion() {
            const q = questions[currentQIndex];
            
            // 更新 UI 文字
            document.getElementById('current-q-num').innerText = currentQIndex + 1;
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-scenario').innerText = q.scenario;
            
            // 更新進度條
            const progress = ((currentQIndex) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // 重置按鈕與回饋區
            document.getElementById('action-buttons').classList.remove('hidden');
            document.getElementById('feedback-area').classList.add('hidden');
            
            // 重置動畫 class 以便下次觸發
            const card = document.querySelector('.glass-panel');
            card.classList.remove('animate__shakeX', 'animate__pulse');
        }

        // 檢查答案
        function checkAnswer(userChoiceIsSafe) {
            const q = questions[currentQIndex];
            const isCorrect = (userChoiceIsSafe === q.isSafe);
            
            // 隱藏按鈕區
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('feedback-area').classList.remove('hidden');

            const header = document.getElementById('result-header');
            const explanation = document.getElementById('explanation-text');
            const card = document.querySelector('.glass-panel');

            if (isCorrect) {
                score++;
                document.getElementById('score-display').innerText = score;
                header.innerHTML = '<span class="text-green-400">✅ 答對了！</span>';
                card.classList.add('animate__animated', 'animate__pulse'); // 答對微動
            } else {
                header.innerHTML = '<span class="text-red-400">❌ 答錯了！</span>';
                card.classList.add('animate__animated', 'animate__shakeX'); // 答錯晃動
            }

            // 顯示正確的狀態描述
            let statusText = q.isSafe ? "【這是安全操作】" : "【這是危險操作】";
            explanation.innerHTML = `<strong class="block mb-2 text-xl">${statusText}</strong>${q.explanation}`;
        }

        // 下一題
        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // 顯示結果
        function showResult() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('final-score').innerText = score;
            
            let rank = "";
            let colorClass = "";
            if (score === 8) {
                rank = "🏆 AI 資安防禦大師！(完美)";
                colorClass = "text-yellow-400";
            } else if (score >= 6) {
                rank = "🛡️ 資安守門員 (優秀)";
                colorClass = "text-cyan-400";
            } else if (score >= 4) {
                rank = "⚠️ 資安實習生 (及格)";
                colorClass = "text-orange-400";
            } else {
                rank = "🚨 請立即重修資安課程！(危險)";
                colorClass = "text-red-500";
            }
            
            const rankEl = document.getElementById('final-rank');
            rankEl.innerText = rank;
            rankEl.className = `text-2xl font-bold ${colorClass}`;
        }

    </script>
</body>
</html>
