                                        </h3>
                                        <div className="relative">
                                            {/* Timeline Line */}
                                            <div className="absolute left-6 top-0 bottom-0 w-0.5 bg-slate-200"></div>
                                            
                                            <div className="space-y-8">
                                                {roadmapSteps.map((step, idx) => (
                                                    <div key={idx} className="relative flex items-start gap-4 ml-2">
                                                        <div className={`z-10 w-8 h-8 rounded-full flex items-center justify-center border-2 
                                                            ${step.status === 'completed' ? 'bg-emerald-100 border-emerald-500 text-emerald-600' : 
                                                            step.status === 'current' ? 'bg-indigo-100 border-indigo-500 text-indigo-600 animate-pulse' : 
                                                            'bg-slate-50 border-slate-300 text-slate-400'}`}>
                                                            {step.status === 'completed' ? <CheckCircle2 className="w-5 h-5" /> : idx + 1}
                                                        </div>
                                                        <div className="bg-slate-50 p-4 rounded-lg flex-1 border border-slate-100">
                                                            <h4 className={`font-bold ${step.status === 'current' ? 'text-indigo-700' : 'text-slate-700'}`}>
                                                                {step.stage}
                                                            </h4>
                                                            <p className="text-sm text-slate-500 mt-1">{step.desc}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4">重點專案監控</h3>
                                        {currentData.projects.length === 0 ? (
                                            <p className="text-slate-500 text-sm p-4">目前該部門無重點專案。</p>
                                        ) : (
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-sm text-left">
                                                    <thead className="bg-slate-50 text-slate-500">
                                                        <tr>
                                                            <th className="px-4 py-2">專案名稱</th>
                                                            <th className="px-4 py-2">負責人</th>
                                                            <th className="px-4 py-2">類型</th>
                                                            <th className="px-4 py-2">進度</th>
                                                            <th className="px-4 py-2">風險</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {currentData.projects.map((p) => (
                                                            <tr key={p.id} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                                                <td className="px-4 py-3 font-medium">{p.name}</td>
                                                                <td className="px-4 py-3 text-slate-500">{p.owner}</td>
                                                                <td className="px-4 py-3"><span className="bg-slate-100 px-2 py-1 rounded text-xs">{p.type}</span></td>
                                                                <td className="px-4 py-3">
                                                                    <div className="flex items-center gap-2">
                                                                        <div className="w-20 bg-slate-200 rounded-full h-1.5">
                                                                            <div className={`h-1.5 rounded-full ${p.progress === 100 ? 'bg-emerald-500' : 'bg-indigo-500'}`} style={{width: `${p.progress}%`}}></div>
                                                                        </div>
                                                                        <span className="text-xs text-slate-500">{p.progress}%</span>
                                                                    </div>
                                                                </td>
                                                                <td className="px-4 py-3">
                                                                    {p.risk === 'high' && <span className="text-rose-600 font-bold text-xs flex items-center gap-1"><AlertCircle className="w-3 h-3"/> High</span>}
                                                                    {p.risk === 'medium' && <span className="text-amber-500 font-bold text-xs">Medium</span>}
                                                                    {p.risk === 'low' && <span className="text-emerald-500 font-bold text-xs">Low</span>}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </React.Fragment>
                            )}

                            {/* TAB: 執行進度 */}
                            {activeTab === 'execution' && (
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-lg font-bold text-slate-800">
                                            {selectedDept === 'All' ? '各部門' : selectedDept} 技能轉型滲透率
                                        </h3>
                                        <div className="flex gap-2">
                                            <span className="flex items-center gap-1 text-xs text-slate-500"><div className="w-3 h-3 bg-indigo-500 rounded-sm"></div> 已完成</span>
                                            <span className="flex items-center gap-1 text-xs text-slate-500"><div className="w-3 h-3 bg-slate-200 rounded-sm"></div> 未完成</span>
                                        </div>
                                    </div>
                                    <div className="h-80 w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={filteredTrainingData} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" horizontal={false} />
                                                <XAxis type="number" domain={[0, 100]} />
                                                <YAxis dataKey="dept" type="category" tick={{fontWeight: 'bold', fill: '#475569'}} />
                                                <Tooltip cursor={{fill: 'transparent'}} contentStyle={{borderRadius: '8px'}} />
                                                <Bar dataKey="completed" name="已完成培訓 (%)" stackId="a" fill="#6366f1" radius={[0, 4, 4, 0]} barSize={24} />
                                                <Bar dataKey="pending" name="未完成 (%)" stackId="a" fill="#e2e8f0" radius={[0, 4, 4, 0]} barSize={24} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                    {(selectedDept === 'All' || selectedDept === '財務部' || selectedDept === '人資部') && (
                                        <div className="mt-4 p-3 bg-rose-50 border border-rose-100 rounded text-sm text-rose-700 flex items-start gap-2">
                                            <AlertCircle className="w-4 h-4 mt-0.5 shrink-0" />
                                            <p><strong>注意：</strong> 財務部與人資部的完成率顯著落後，建議人資長介入了解「業務繁忙」是否為主要阻礙。</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* TAB: 成本效益 */}
                            {activeTab === 'financials' && (
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <h3 className="text-lg font-bold text-slate-800 mb-2">AI 運算成本 vs. 預算監控</h3>
                                    <p className="text-sm text-slate-500 mb-6">追蹤 {selectedDept === 'All' ? '全公司' : selectedDept} API Token 用量與軟體授權 (SaaS License) 費用趨勢</p>
                                    <div className="h-80 w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={currentData.costData} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                                                <defs>
                                                    <linearGradient id="colorApi" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#f59e0b" stopOpacity={0.8}/>
                                                        <stop offset="95%" stopColor="#f59e0b" stopOpacity={0}/>
                                                    </linearGradient>
                                                    <linearGradient id="colorLicense" x1="0" y1="0" x2="0" y2="1">
                                                        <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.8}/>
                                                        <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                                    </linearGradient>
                                                </defs>
                                                <XAxis dataKey="month" />
                                                <YAxis />
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                                <Tooltip />
                                                <Legend verticalAlign="top" height={36}/>
                                                <Area type="monotone" dataKey="apiCost" name="API 流量費" stackId="1" stroke="#f59e0b" fill="url(#colorApi)" />
                                                <Area type="monotone" dataKey="licenseCost" name="軟體訂閱費" stackId="1" stroke="#3b82f6" fill="url(#colorLicense)" />
                                                <Line type="step" dataKey="budget" name="預算上限" stroke="#ef4444" strokeWidth={2} strokeDasharray="5 5" />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="mt-4 flex gap-4">
                                        <div className="flex-1 bg-slate-50 p-3 rounded border border-slate-100">
                                            <p className="text-xs text-slate-500">本月 API 花費</p>
                                            <p className="text-lg font-bold text-amber-600">
                                                ${currentData.costData[5].apiCost.toLocaleString()}
                                            </p>
                                        </div>
                                        <div className="flex-1 bg-slate-50 p-3 rounded border border-slate-100">
                                            <p className="text-xs text-slate-500">本月軟體訂閱費</p>
                                            <p className="text-lg font-bold text-blue-600">
                                                ${currentData.costData[5].licenseCost.toLocaleString()}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: 組織與協商 */}
                            {activeTab === 'people' && (
                                <React.Fragment>
                                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4">{selectedDept === 'All' ? '各部門' : selectedDept} 協商議題看板</h3>
                                        <div className="space-y-3">
                                            {currentData.issues.length === 0 ? (
                                                <p className="text-slate-500 text-sm">目前無待協商議題。</p>
                                            ) : (
                                                currentData.issues.map((issue, idx) => (
                                                    <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg hover:bg-slate-100 transition-colors">
                                                        <div className="flex items-center gap-3">
                                                            <span className={`px-2 py-1 rounded text-xs font-bold w-12 text-center
                                                                ${issue.type === '行政' ? 'bg-orange-100 text-orange-700' : 
                                                                issue.type === '制度' ? 'bg-purple-100 text-purple-700' : 
                                                                issue.type === '法規' ? 'bg-red-100 text-red-700' : 
                                                                issue.type === '技能' ? 'bg-blue-100 text-blue-700' : 
                                                                issue.type === '心理' ? 'bg-pink-100 text-pink-700' : 'bg-slate-200 text-slate-600'}`}>
                                                                {issue.type}
                                                            </span>
                                                            <div>
                                                                <p className="font-medium text-slate-700 text-sm">{issue.topic}</p>
                                                                <p className="text-xs text-slate-500">{issue.count} 人關注</p>
                                                            </div>
                                                        </div>
                                                        <span className={`text-xs px-2 py-1 rounded-full border 
                                                            ${issue.status === '已解決' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 
                                                            issue.status === '處理中' ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}>
                                                            {issue.status}
                                                        </span>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    {/* 轉型英雄榜 */}
                                    <div className="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 rounded-xl shadow-lg text-white">
                                        <div className="flex items-center gap-2 mb-4">
                                            <Award className="w-6 h-6 text-yellow-300" />
                                            <h3 className="text-lg font-bold">本月 {selectedDept === 'All' ? '全公司' : selectedDept} 轉型英雄 (Champions)</h3>
                                        </div>
                                        {currentData.champions.length === 0 ? (
                                            <p className="text-indigo-200 text-sm italic">本部門本月暫無英雄上榜，加油！</p>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {currentData.champions.map((champ, idx) => (
                                                    <div key={idx} className="bg-white/10 backdrop-blur-sm p-4 rounded-lg border border-white/20">
                                                        <div className="flex items-center justify-between mb-2">
                                                            <span className="font-bold text-yellow-300 text-lg">#{idx + 1}</span>
                                                            <span className="text-xs bg-white/20 px-2 py-0.5 rounded text-white">{champ.name}</span>
                                                        </div>
                                                        <p className="text-sm font-medium mb-1">{champ.achievement}</p>
                                                        <p className="text-xs text-indigo-200">Impact: {champ.impact}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </React.Fragment>
                            )}
                        </div>

                        {/* Right Column: Action Center */}
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-fit">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <CheckCircle2 className="w-5 h-5 text-emerald-500" />
                                    {selectedDept === 'All' ? '總部' : selectedDept} 行動待辦
                                </h3>
                                
                                <div className="space-y-4">
                                    {currentData.actions.map((action, idx) => (
                                        <div key={idx} className="pb-4 border-b border-slate-100 last:border-0 last:pb-0">
                                            <div className="flex justify-between items-start mb-1">
                                                <span className="text-sm font-medium text-slate-700">{action.title}</span>
                                                <span className={`text-xs px-1.5 py-0.5 rounded font-bold
                                                    ${action.priority === 'High' ? 'bg-rose-100 text-rose-700' : 
                                                    action.priority === 'Med' ? 'bg-amber-100 text-amber-700' : 'bg-indigo-100 text-indigo-700'}`}>
                                                    {action.priority}
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-500 mb-2">{action.desc}</p>
                                            <button className="w-full py-1.5 text-xs bg-slate-800 text-white rounded hover:bg-slate-700 transition-colors">
                                                {action.btn}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Weekly Wisdom */}
                            <div className="bg-indigo-900 text-white p-6 rounded-xl shadow-lg">
                                <h4 className="font-bold text-sm mb-3 text-indigo-200 uppercase tracking-wider">每週心法</h4>
                                <p className="text-lg font-serif italic mb-4">
                                "AI 不會取代你，但會使用 AI 的人將會取代你。"
                                </p>
                                <div className="flex gap-2">
                                    <span className="text-xs bg-indigo-800 px-2 py-1 rounded">#擁抱改變</span>
                                    <span className="text-xs bg-indigo-800 px-2 py-1 rounded">#終身學習</span>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
